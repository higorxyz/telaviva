name: Feature request
description: Propose a new product or technical improvement
title: "feat: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or engineering problem are we solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed behavior and scope.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define clear, testable outcomes.
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: Performance, security, UX, compatibility, complexity.

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: References, mocks, related issues.
