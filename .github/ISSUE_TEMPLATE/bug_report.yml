name: Bug report
description: Report a reproducible defect
title: 'bug: '
labels:
  - bug
  - needs-triage
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the app is affected?
      options:
        - Home
        - Movie or series details
        - Episode tracking
        - Search
        - Discover / genres
        - Minha lista
        - Sign-in / account
        - Offline / installed app
        - Navigation
        - Build/CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - major
        - minor
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear and ordered reproduction steps.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, browser, signed in or visitor, online or offline, installed app or tab.
      placeholder: Pixel 7, Chrome 142, signed in, installed app, offline
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, videos, related issues.
