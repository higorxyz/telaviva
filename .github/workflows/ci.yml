name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, Typecheck, Test, Build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs `npm run build` (the production build, which prerenders against the local TMDb mock) and then
      # serves it for the tests (see playwright.config.ts). It is the same build as a plain `npm run build`
      # except for the TMDb base URL and token, so a separate build step would only repeat it.
      - name: Production build, E2E and accessibility tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
